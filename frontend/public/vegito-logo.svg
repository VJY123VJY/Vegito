<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="vBadgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#0A4D3C" />
    </linearGradient>
    <linearGradient id="vLeafLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B5E20" />
      <stop offset="100%" stop-color="#4CAF50" />
    </linearGradient>
    <linearGradient id="vLeafRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#66BB6A" />
    </linearGradient>
    <linearGradient id="vLightning" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A7FFEB" />
      <stop offset="100%" stop-color="#76FF03" />
    </linearGradient>
    <filter id="vGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ── 1. EMBLEM SYMBOL (Left) ── -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Squircle Base -->
    <rect x="0" y="0" width="100" height="100" rx="28" fill="url(#vBadgeGrad)" stroke="#16835B" stroke-width="2.5" />

    <!-- Top Specular Highlight -->
    <path d="M 20 12 C 35 8 65 8 80 12 C 90 20 94 32 96 40 C 75 25 25 25 4 40 C 6 32 10 20 20 12 Z" fill="#FFFFFF" fill-opacity="0.15" />

    <!-- Left Faceted Leaf Wing / V-Form -->
    <path d="M 50 82 C 44 72 26 54 22 34 C 36 28 48 38 50 82 Z" fill="url(#vLeafLeft)" />
    <path d="M 50 82 C 46 72 32 52 28 36 C 40 33 48 44 50 82 Z" fill="#4CAF50" fill-opacity="0.8" />

    <!-- Right Faceted Leaf Wing / V-Form -->
    <path d="M 50 82 C 56 72 74 54 78 34 C 64 28 52 38 50 82 Z" fill="url(#vLeafRight)" />
    <path d="M 50 82 C 54 72 68 52 72 36 C 60 33 52 44 50 82 Z" fill="#66BB6A" fill-opacity="0.8" />

    <!-- Central Lightning Speed V-Blade & Energy -->
    <path d="M 50 82 C 48 70 40 50 36 36 C 42 38 48 48 50 82 C 52 48 58 38 64 36 C 60 50 52 70 50 82 Z" fill="url(#vLightning)" filter="url(#vGlow)" />
    <path d="M 50 82 C 49 72 44 54 41 40 C 44 41 48 50 50 82 Z" fill="#FFFFFF" fill-opacity="0.9" />

    <!-- Harvest Seed / Delivery Node at Apex -->
    <circle cx="50" cy="32" r="4.5" fill="#121212" stroke="#76FF03" stroke-width="1.5" />
    <circle cx="50" cy="32" r="2" fill="#FFB300" />
  </g>

  <!-- ── 2. VEGITO WORDMARK (Right) ── -->
  <g transform="translate(130, 74)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="52" font-weight="900" fill="#0A4D3C" letter-spacing="-1.5">VEGITO</text>
    <circle cx="205" cy="-8" r="7" fill="#76FF03" />
    <text x="3" y="24" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#16835B" letter-spacing="4">FRESH • FAST • TECH</text>
  </g>
</svg>
