<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="vTileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A4D3C" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>
    <linearGradient id="vJacketGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16835B" />
      <stop offset="100%" stop-color="#0A4D3C" />
    </linearGradient>
    <linearGradient id="vBikeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="vCrateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="0" y="0" width="140" height="140" rx="34" fill="url(#vTileGrad)" />

  <!-- Delivery Rider + Bike Centered -->
  <g transform="translate(0, 14)">
    <!-- Speed Lines -->
    <line x1="8" y1="92" x2="22" y2="92" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="4" y1="78" x2="16" y2="78" stroke="#34D399" stroke-width="2" stroke-linecap="round" opacity="0.5" />

    <!-- Ground Shadow -->
    <ellipse cx="72" cy="103" rx="46" ry="4" fill="rgba(0, 0, 0, 0.3)" />

    <!-- Wheels -->
    <g>
      <circle cx="36" cy="88" r="15" fill="#1E293B" />
      <circle cx="36" cy="88" r="10.5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" />
      <circle cx="36" cy="88" r="4.5" fill="#16835B" />
    </g>
    <g>
      <circle cx="106" cy="88" r="15" fill="#1E293B" />
      <circle cx="106" cy="88" r="10.5" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" />
      <circle cx="106" cy="88" r="4.5" fill="#16835B" />
    </g>

    <!-- Chassis Body -->
    <path d="M 38 88 L 52 74 L 82 74 L 102 88 L 94 62 L 76 68 L 54 68 Z" fill="url(#vBikeGrad)" />
    <path d="M 50 82 L 84 82 L 80 88 L 48 88 Z" fill="#0F172A" />

    <!-- Steering Fork & Handlebars -->
    <path d="M 106 88 L 95 52 L 88 48" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />
    <circle cx="87" cy="48" r="3.5" fill="#0F172A" />

    <!-- Headlight -->
    <path d="M 98 56 L 107 58 L 98 63 Z" fill="#F59E0B" />
    <ellipse cx="106" cy="59" rx="1.5" ry="3" fill="#FFFFFF" />

    <!-- Delivery Crate -->
    <rect x="22" y="54" width="26" height="20" rx="4" fill="url(#vCrateGrad)" stroke="#042F2E" stroke-width="1.2" />
    <line x1="25" y1="60" x2="45" y2="60" stroke="#14B8A6" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
    <line x1="25" y1="66" x2="45" y2="66" stroke="#14B8A6" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

    <!-- Fresh Vegetables -->
    <path d="M 23 54 C 20 46, 26 40, 31 46 C 36 40, 43 44, 40 54 Z" fill="#22C55E" />
    <path d="M 28 54 C 27 46, 33 42, 36 48 Z" fill="#4ADE80" />
    <circle cx="43" cy="52" r="6" fill="#EF4444" />
    <circle cx="41.5" cy="49.5" r="1.5" fill="#FCA5A5" />
    <path d="M 43 46 L 42 44 M 43 46 L 45 45 M 43 46 L 43 43" stroke="#15803D" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 36 50 L 48 38 C 49 37, 51 39, 49 41 L 38 53 Z" fill="#F97316" />
    <path d="M 49 38 L 54 34 M 49 38 L 52 32 M 50 39 L 55 38" stroke="#22C55E" stroke-width="1.2" stroke-linecap="round" />

    <!-- Delivery Rider -->
    <path d="M 52 68 L 65 74 L 74 84" stroke="#0F172A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 48 66 L 56 46 L 75 48 L 70 70 Z" fill="url(#vJacketGrad)" stroke="#064E3B" stroke-width="1" />
    <path d="M 68 50 L 80 56 L 87 49" stroke="#16835B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="87" cy="49" r="3" fill="#0F172A" />
    <circle cx="66" cy="34" r="11" fill="#0F172A" />
    <path d="M 66 25 C 72 25, 77 29, 77 35 L 68 35 Z" fill="#10B981" />
    <path d="M 72 32 L 77 33 L 73 35 Z" fill="#67E8F9" />
  </g>
</svg>
