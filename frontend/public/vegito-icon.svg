<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="vTileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#0A4D3C" />
    </linearGradient>
    <linearGradient id="vLeafLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B5E20" />
      <stop offset="100%" stop-color="#4CAF50" />
    </linearGradient>
    <linearGradient id="vLeafRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#66BB6A" />
    </linearGradient>
    <linearGradient id="vLightning" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A7FFEB" />
      <stop offset="100%" stop-color="#76FF03" />
    </linearGradient>
    <filter id="vGlowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="0" y="0" width="140" height="140" rx="36" fill="url(#vTileGrad)" stroke="#16835B" stroke-width="3" />

  <!-- Emblem Symbol Centered -->
  <g transform="translate(20, 20)">
    <!-- Top Specular Highlight -->
    <path d="M 20 6 C 35 2 65 2 80 6 C 90 12 94 22 96 30 C 75 16 25 16 4 30 C 6 22 10 12 20 6 Z" fill="#FFFFFF" fill-opacity="0.15" />

    <!-- Left Faceted Leaf Wing / V-Form -->
    <path d="M 50 86 C 44 74 26 54 22 32 C 36 26 48 36 50 86 Z" fill="url(#vLeafLeft)" />
    <path d="M 50 86 C 46 74 32 52 28 34 C 40 31 48 42 50 86 Z" fill="#4CAF50" fill-opacity="0.8" />

    <!-- Right Faceted Leaf Wing / V-Form -->
    <path d="M 50 86 C 56 74 74 54 78 32 C 64 26 52 36 50 86 Z" fill="url(#vLeafRight)" />
    <path d="M 50 86 C 54 74 68 52 72 34 C 60 31 52 42 50 86 Z" fill="#66BB6A" fill-opacity="0.8" />

    <!-- Central Lightning Speed V-Blade & Energy -->
    <path d="M 50 86 C 48 72 40 50 36 34 C 42 36 48 48 50 86 C 52 48 58 36 64 34 C 60 50 52 72 50 86 Z" fill="url(#vLightning)" filter="url(#vGlowIcon)" />
    <path d="M 50 86 C 49 74 44 54 41 38 C 44 39 48 48 50 86 Z" fill="#FFFFFF" fill-opacity="0.9" />

    <!-- Harvest Seed / Delivery Node at Apex -->
    <circle cx="50" cy="28" r="5" fill="#121212" stroke="#76FF03" stroke-width="1.5" />
    <circle cx="50" cy="28" r="2.2" fill="#FFB300" />
  </g>
</svg>
