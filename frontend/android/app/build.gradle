apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def vegitoApiBaseUrl = findProperty("vegitoApiBaseUrl") ?: System.getenv("VEGITO_API_BASE_URL")

if (!vegitoApiBaseUrl) {
    vegitoApiBaseUrl = "https://vegito-git-main-vijaydhavan04-1868s-projects.vercel.app/"
}

if (!vegitoApiBaseUrl.endsWith("/")) {
    vegitoApiBaseUrl += "/"
}

android {
    namespace = "com.vegito.app"

    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.vegito.app"

        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode 1
        versionName "1.0"

        buildConfigField "String", "VEGITO_API_BASE_URL", "\"${vegitoApiBaseUrl}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
        freeCompilerArgs += [
            "-Xskip-metadata-version-check"
        ]
    }

    buildTypes {
        release {
            minifyEnabled false

            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {

    // ============================================================
    // LOCAL JAR FILES
    // ============================================================

    implementation fileTree(
            include: ['*.jar'],
            dir: 'libs'
    )


    // ============================================================
    // ANDROIDX
    // ============================================================

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"

    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"

    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"


    // ============================================================
    // JETPACK COMPOSE
    // ============================================================

    implementation 'androidx.compose.ui:ui:1.7.5'

    implementation 'androidx.compose.ui:ui-graphics:1.7.5'

    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.5'

    implementation 'androidx.compose.material3:material3:1.3.1'

    implementation 'androidx.compose.material:material-icons-extended:1.7.5'

    implementation 'androidx.activity:activity-compose:1.9.3'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'

    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'

    implementation 'androidx.navigation:navigation-compose:2.8.3'


    // ============================================================
    // FIREBASE
    // REAL PHONE OTP AUTHENTICATION
    // ============================================================

    implementation platform('com.google.firebase:firebase-bom:34.19.0')

    implementation 'com.google.firebase:firebase-auth'


    // ============================================================
    // NETWORK / RETROFIT
    // ============================================================

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'

    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'


    // ============================================================
    // COROUTINES
    // ============================================================

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'


    // ============================================================
    // IMAGE LOADING
    // ============================================================

    implementation 'io.coil-kt:coil-compose:2.7.0'


    // ============================================================
    // LOCATION
    // FUSED LOCATION PROVIDER
    // ============================================================

    implementation 'com.google.android.gms:play-services-location:21.3.0'


    // ============================================================
    // CAPACITOR
    // DO NOT REMOVE
    // ============================================================

    implementation project(':capacitor-android')

    implementation project(':capacitor-cordova-android-plugins')


    // ============================================================
    // TESTING
    // ============================================================

    testImplementation "junit:junit:$junitVersion"

    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"

    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}


// ================================================================
// CAPACITOR
// ================================================================

apply from: 'capacitor.build.gradle'


// ================================================================
// GOOGLE SERVICES / FIREBASE
// ================================================================

try {
    def servicesJSON = file('google-services.json')

    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }

} catch(Exception e) {

    logger.info(
            "google-services.json not found, google-services plugin not applied."
    )
}